<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B1221"/>
      <stop offset="100%" stop-color="#071120"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>
    <linearGradient id="ogAccentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.04" stroke="#00E5FF" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Decorative gradient orb top-right -->
  <circle cx="950" cy="120" r="200" fill="#00E5FF" opacity="0.04" filter="url(#glow)"/>
  <circle cx="250" cy="500" r="150" fill="#00FF87" opacity="0.03" filter="url(#glow)"/>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#ogAccent)" opacity="0.8"/>

  <!-- Logo mark (scaled version of favicon) -->
  <g transform="translate(100, 200) scale(3.5)">
    <rect width="32" height="32" rx="7" ry="7" fill="#1E293B" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.3"/>
    <circle cx="16" cy="16" r="9" fill="none" stroke="url(#ogAccent)" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="16" cy="16" rx="9" ry="4" fill="none" stroke="url(#ogAccent)" stroke-width="1.2" opacity="0.3"/>
    <ellipse cx="16" cy="16" rx="4" ry="9" fill="none" stroke="url(#ogAccent)" stroke-width="1.2" opacity="0.3"/>
    <path d="M12 8.5 L12 23.5 L17 23.5 Q23.5 23.5 23.5 16 Q23.5 8.5 17 8.5 Z"
          fill="none" stroke="url(#ogAccent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="12" cy="8.5" r="1.6" fill="#00E5FF"/>
    <circle cx="12" cy="23.5" r="1.6" fill="#00FF87"/>
    <circle cx="23" cy="16" r="1.6" fill="#00E5FF"/>
    <circle cx="21" cy="9.5" r="0.9" fill="#00FF87" opacity="0.8"/>
    <circle cx="24" cy="12" r="0.7" fill="#00E5FF" opacity="0.6"/>
  </g>

  <!-- Site name -->
  <text x="260" y="260" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="700" fill="#F1F5F9" filter="url(#textGlow)">
    DNSChecker<tspan fill="#00E5FF">.space</tspan>
  </text>

  <!-- Subtitle -->
  <text x="260" y="310" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="400" fill="#94A3B8">
    Free IP &amp; Network Intelligence Tools
  </text>

  <!-- Feature pills -->
  <g transform="translate(260, 345)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#00E5FF" text-anchor="middle">IP Lookup</text>

    <rect x="155" y="0" width="160" height="36" rx="18" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3"/>
    <text x="235" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#00E5FF" text-anchor="middle">DNS Records</text>

    <rect x="330" y="0" width="140" height="36" rx="18" fill="#00FF87" fill-opacity="0.1" stroke="#00FF87" stroke-width="1" stroke-opacity="0.3"/>
    <text x="400" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#00FF87" text-anchor="middle">Whois</text>

    <rect x="485" y="0" width="170" height="36" rx="18" fill="#00FF87" fill-opacity="0.1" stroke="#00FF87" stroke-width="1" stroke-opacity="0.3"/>
    <text x="570" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#00FF87" text-anchor="middle">Geolocation</text>
  </g>

  <!-- Network decoration nodes (right side) -->
  <g filter="url(#glow)" opacity="0.5">
    <circle cx="900" cy="300" r="4" fill="#00E5FF"/>
    <circle cx="980" cy="250" r="3" fill="#00FF87"/>
    <circle cx="1050" cy="320" r="5" fill="#00E5FF"/>
    <circle cx="950" cy="400" r="3.5" fill="#00FF87"/>
    <circle cx="1100" cy="380" r="3" fill="#00E5FF"/>
    <line x1="900" y1="300" x2="980" y2="250" stroke="#00E5FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="980" y1="250" x2="1050" y2="320" stroke="#00E5FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="1050" y1="320" x2="950" y2="400" stroke="#00FF87" stroke-width="0.8" opacity="0.3"/>
    <line x1="1050" y1="320" x2="1100" y2="380" stroke="#00E5FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="900" y1="300" x2="950" y2="400" stroke="#00FF87" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#ogAccent)" opacity="0.6"/>

  <!-- URL in bottom-right -->
  <text x="1160" y="600" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="400" fill="#475569" text-anchor="end">
    dnschecker.space
  </text>
</svg>
