name: Daily Blog Auto-Publisher & Google Rank Alert

on:
  schedule:
    # Run daily at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-blog-and-seo:
    name: Generate Blog, Ping Google & Notify Chat
    runs-on: ubuntu-latest
    env:
      GOOGLE_CHAT_WEBHOOK_URL: "https://chat.googleapis.com/v1/spaces/AAQACHJ1rC8/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=1UnFa25iYnNkNqy6yjkmpppbUFxUT0Yf4FUmTX8uWi4"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Daily Auto-Blog & Google Chat Notification
        run: node scripts/seo-automation/daily-auto-blog.js

      - name: Push Committed Changes to Main
        run: |
          git push origin HEAD:main || echo "Changes already pushed or up-to-date"

      - name: Submit URLs to IndexNow (Bing & Yandex)
        run: npm run indexnow

      - name: Run Endpoint Health Check
        run: npm run seo:monitor
